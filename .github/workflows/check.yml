# Tests the tools and the plugin on every platform, and checks that the
# synced files match the upstream commits in tools/sources.lock.json.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test "tools/test/*.test.mjs"

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Synced files match tools/sources.lock.json
        run: node tools/sync.mjs --check
      - name: Claude Code accepts the marketplace and plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.285 plugin validate .
